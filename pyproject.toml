[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnn-from-scratch"
version = "0.2.0"
description = "Educational RNN, LSTM, and GRU implementations from scratch in PyTorch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "George Yiasemis" }]
keywords = ["pytorch", "rnn", "lstm", "gru", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/georgeyiasemis/Recurrent-Neural-Networks-from-scratch-using-PyTorch"
Repository = "https://github.com/georgeyiasemis/Recurrent-Neural-Networks-from-scratch-using-PyTorch"

[tool.setuptools]
py-modules = ["rnncells", "rnnmodels"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
